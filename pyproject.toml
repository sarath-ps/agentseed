[project]
name = "agentseed"
version = "0.1.0"
description = "Lightweight framework for bootstrapping agentic AI development projects"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sarath P.S." }]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
]

[project.scripts]
agentseed = "agentseed.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentseed"]

[tool.ruff]
line-length = 100
target-version = "py310"
